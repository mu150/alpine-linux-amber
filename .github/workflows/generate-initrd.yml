name: Generate Alpine ARM64 initrd+kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
fetch-kernel:
  runs-on: ubuntu-latest
  outputs:
    zimage-path: ${{ steps.kernel-step.outputs.zimage-path }}
  steps:
    - name: Fetch and extract kernel
      id: kernel-step
      run: |
        set -eux
        URL=http://dl-cdn.alpinelinux.org/alpine/v3.22/main/aarch64/APKINDEX.tar.gz
        APKVER=$(wget -qO- "$URL" | gunzip | awk -F':' '
          $1 == "P" { found=0 }
          {
            key=$1
            $0=$0
            value=substr($0, length(key)+2)
          }
          key == "P" && value == "linux-virt" { found=1 }
          key == "V" && found { print value; exit }
        ')
        wget "http://dl-cdn.alpinelinux.org/alpine/v3.22/main/aarch64/linux-virt-${APKVER}.apk"
        mkdir kpkg
        tar xf linux-virt-${APKVER}.apk -C kpkg
        tar xzf kpkg/data.tar.gz -C kpkg ./boot/vmlinuz-virt
        mv kpkg/boot/vmlinuz-virt ./zImage
        echo "zimage-path=zImage" >> $GITHUB_OUTPUT
    - uses: actions/upload-artifact@v4
      with:
        name: zImage
        path: zImage

  generate-initrd:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Register QEMU emulation so we can spin up ARM64 containers
      - name: Register QEMU emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      # 3. Build the initrd in an Alpine ARM64 container
      - name: Build initrd via Docker+QEMU
        run: |
          docker run --rm --privileged --platform linux/arm64 \
            -v "${{ github.workspace }}:/outputs" \
            alpine:3.22 \
            sh -euxc '
              apk update
              apk add --no-cache linux-virt mkinitfs busybox

              KVER=$(ls /lib/modules | head -n1)
              echo "Generating initrd for kernel $KVER"

              # mkinitfs always writes to /boot/initramfs-<flavor>
              mkinitfs -k "$KVER"

              # copy it into your workspace
              cp /boot/initramfs-* /outputs/initrd-arm64.gz

              ls -lh /outputs/initrd-arm64.gz
            '

      # 4. Fix permissions so the runner can read it
      - name: Fix initrd permissions
        run: sudo chmod a+r initrd-arm64.gz

      # 5. Upload the artifact
      - name: Upload initrd artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-initrd-arm64
          path: initrd-arm64.gz
