name: Generate Alpine ARM64 initrd+kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  fetch-kernel:
    runs-on: ubuntu-latest
    outputs:
      zimage-path: ${{ steps.kernel-step.outputs.zimage-path }}
      kernel-package-version: ${{ steps.kernel-step.outputs.kernel-package-version }}
      kernel-release: ${{ steps.kernel-step.outputs.kernel-release }}
    steps:
      - name: Fetch and extract kernel
        id: kernel-step
        run: |
          set -eux
          URL=http://dl-cdn.alpinelinux.org/alpine/v3.22/main/aarch64/APKINDEX.tar.gz
          
          # Robust version extraction using awk
          PKGVER=$(wget -qO- "$URL" | gunzip | awk '
            /^P:linux-virt$/ { in_package=1; next }
            in_package && /^V:/ { 
                gsub(/^V:/, "", $0);
                print $0;
                exit
            }
            /^P:/ { in_package=0 }
          ')
          
          echo "Found linux-virt version: $PKGVER"
          wget "http://dl-cdn.alpinelinux.org/alpine/v3.22/main/aarch64/linux-virt-${PKGVER}.apk"
          
          # Extract kernel image directly from APK
          KERNEL_PATH=$(tar -tf linux-virt-${PKGVER}.apk | grep 'boot/vmlinuz-virt$')
          tar -xOf linux-virt-${PKGVER}.apk "$KERNEL_PATH" > zImage
          
          # Get kernel release (uname -r format)
          # Robust method: extract first modules directory name
          KREL=$(tar -tf linux-virt-${PKGVER}.apk | 
                 awk -F/ '/lib\/modules\// && !/\/$/ {print $3; exit}' | 
                 tr -d '\r' | xargs)
          
          # Fallback if still empty
          if [ -z "$KREL" ]; then
            KREL=$(echo "$PKGVER" | sed 's/^[^0-9]*//;s/-.*//')-0-virt
          fi
          
          echo "zimage-path=zImage" >> $GITHUB_OUTPUT
          echo "kernel-package-version=$PKGVER" >> $GITHUB_OUTPUT
          echo "kernel-release=$KREL" >> $GITHUB_OUTPUT
          echo "Package version: $PKGVER"
          echo "Kernel release: $KREL"
          
          # Save APK for initrd job
          cp linux-virt-${PKGVER}.apk kernel-package.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zImage
          path: zImage
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-package
          path: kernel-package.apk

  generate-initrd:
    runs-on: ubuntu-latest
    needs: fetch-kernel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: Download kernel package
        uses: actions/download-artifact@v4
        with:
          name: kernel-package
          path: .
      
      - name: Build initrd via Docker+QEMU
        run: |
          PKGVER="${{ needs.fetch-kernel.outputs.kernel-package-version }}"
          KREL="${{ needs.fetch-kernel.outputs.kernel-release }}"
          echo "Using package version: $PKGVER"
          echo "Using kernel release: $KREL"
          
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/outputs" \
            alpine:3.22 \
            sh -euxc "
              apk update
              # Install kernel package from local file
              apk add --no-cache --allow-untrusted /outputs/kernel-package.apk
              apk add --no-cache mkinitfs
              
              # Verify kernel release
              echo 'Installed kernel modules:'
              ls /lib/modules
              
              echo 'Generating initrd for kernel $KREL'
              mkinitfs -k '$KREL'
              cp /boot/initramfs-* /outputs/initrd-arm64.gz
              ls -lh /outputs/initrd-arm64.gz
            "
      - name: Fix initrd permissions
        run: sudo chmod a+r initrd-arm64.gz
      
      - name: Upload initrd artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-initrd-arm64
          path: initrd-arm64.gz
