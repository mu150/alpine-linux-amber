name: Generate Alpine ARM64 initrd+kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  fetch-kernel:
    runs-on: ubuntu-latest
    outputs:
      zimage-path: ${{ steps.kernel-step.outputs.zimage-path }}
      kernel-version: ${{ steps.kernel-step.outputs.kernel-version }}
    steps:
      - name: Fetch and extract kernel
        id: kernel-step
        run: |
          set -eux
          URL=http://dl-cdn.alpinelinux.org/alpine/v3.22/main/aarch64/APKINDEX.tar.gz
          
          # Robust version extraction using awk
          APKVER=$(wget -qO- "$URL" | gunzip | awk '
            /^P:linux-virt$/ { in_package=1; next }
            in_package && /^V:/ { 
                gsub(/^V:/, "", $0);
                print $0;
                exit
            }
            /^P:/ { in_package=0 }  # Reset when new package starts
          ')
          
          echo "Found linux-virt version: $APKVER"
          wget "http://dl-cdn.alpinelinux.org/alpine/v3.22/main/aarch64/linux-virt-${APKVER}.apk"
          
          # Properly extract APK as ar archive
          mkdir kpkg
          ar x linux-virt-${APKVER}.apk --output kpkg
          
          # Extract kernel image from data.tar.gz
          tar xzf kpkg/data.tar.gz -C . ./boot/vmlinuz-virt
          mv boot/vmlinuz-virt ./zImage
          
          # Extract kernel version from modules directory
          KVER=$(tar -ztf kpkg/data.tar.gz | awk -F/ '$2 == "lib" && $3 == "modules" {print $4; exit}')
          echo "zimage-path=zImage" >> $GITHUB_OUTPUT
          echo "kernel-version=$KVER" >> $GITHUB_OUTPUT
          echo "Kernel version: $KVER"
      - uses: actions/upload-artifact@v4
        with:
          name: zImage
          path: zImage

  generate-initrd:
    runs-on: ubuntu-latest
    needs: fetch-kernel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Register QEMU emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      
      - name: Build initrd via Docker+QEMU
        run: |
          KVER="${{ needs.fetch-kernel.outputs.kernel-version }}"
          echo "Using kernel version: $KVER"
          
          docker run --rm --privileged --platform linux/arm64 \
            -v "${{ github.workspace }}:/outputs" \
            alpine:3.22 \
            sh -euxc "
              apk update
              apk add --no-cache linux-virt=$KVER mkinitfs
              echo 'Generating initrd for kernel $KVER'
              mkinitfs -k '$KVER'
              cp /boot/initramfs-* /outputs/initrd-arm64.gz
              ls -lh /outputs/initrd-arm64.gz
            "
      - name: Fix initrd permissions
        run: sudo chmod a+r initrd-arm64.gz
      
      - name: Upload initrd artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-initrd-arm64
          path: initrd-arm64.gz
