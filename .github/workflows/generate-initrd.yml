name: Generate Alpine ARM64 initrd+kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  fetch-kernel:
    runs-on: ubuntu-latest
    outputs:
      zimage-path: ${{ steps.kernel-step.outputs.zimage-path }}
      kernel-version: ${{ steps.kernel-step.outputs.kernel-version }}
    steps:
      - name: Fetch and extract kernel
        id: kernel-step
        run: |
          set -eux
          URL=https://dl-cdn.alpinelinux.org/alpine/v3.22/main/aarch64/APKINDEX.tar.gz
          APKVER=$(wget -qO- "$URL" | gunzip | awk -F':' '
            $1 == "P" { pkg = $2 }
            $1 == "V" && pkg == "linux-virt" { print $2; exit }
          ')
          wget "https://dl-cdn.alpinelinux.org/alpine/v3.22/main/aarch64/linux-virt-${APKVER}.apk"
          mkdir kpkg
          tar xf linux-virt-${APKVER}.apk -C kpkg
          tar xzf kpkg/data.tar.gz -C kpkg ./boot/vmlinuz-virt
          mv kpkg/boot/vmlinuz-virt ./zImage
          
          # Extract kernel version from modules directory
          KVER=$(ls kpkg/lib/modules)
          echo "zimage-path=zImage" >> $GITHUB_OUTPUT
          echo "kernel-version=$KVER" >> $GITHUB_OUTPUT
          echo "Kernel version: $KVER"
      - uses: actions/upload-artifact@v4
        with:
          name: zImage
          path: zImage

  generate-initrd:
    runs-on: ubuntu-latest
    needs: fetch-kernel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Register QEMU emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
      
      - name: Build initrd via Docker+QEMU
        run: |
          KVER="${{ needs.fetch-kernel.outputs.kernel-version }}"
          echo "Using kernel version: $KVER"
          
          docker run --rm --privileged --platform linux/arm64 \
            -v "${{ github.workspace }}:/outputs" \
            alpine:3.22 \
            sh -euxc "
              apk update
              # Install exact kernel version used in fetch-kernel job
              apk add --no-cache linux-virt=${{ needs.fetch-kernel.outputs.kernel-version }} mkinitfs
              echo 'Generating initrd for kernel $KVER'
              mkinitfs -k '$KVER'
              cp /boot/initramfs-* /outputs/initrd-arm64.gz
              ls -lh /outputs/initrd-arm64.gz
            "
      - name: Fix initrd permissions
        run: sudo chmod a+r initrd-arm64.gz
      
      - name: Upload initrd artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpine-initrd-arm64
          path: initrd-arm64.gz
